<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a14">
    <title>STARK INDUSTRIES — Arc Reactor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a14;
            overflow: hidden;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            cursor: crosshair;
        }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }

        /* Loading Screen */
        .loading-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #0a0a14;
            transition: opacity 0.6s ease-out;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-ring {
            width: 60px; height: 60px;
            border: 2px solid rgba(0,212,255,0.2);
            border-top-color: rgba(0,212,255,0.9);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-size: 11px; letter-spacing: 3px;
            color: rgba(0,212,255,0.6);
            text-transform: uppercase;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
        }
        .loading-error {
            display: none; color: rgba(255,100,100,0.8); font-size: 12px;
            margin-top: 16px; text-align: center; max-width: 300px;
            line-height: 1.6;
        }

        /* HUD Overlay */
        .hud-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px;
        }

        .hud-top {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .hud-bottom {
            display: flex; justify-content: space-between; align-items: flex-end;
        }

        .hud-label {
            font-size: 10px; letter-spacing: 2px; color: rgba(0,212,255,0.5);
            text-transform: uppercase;
        }
        .hud-value {
            font-size: 18px; font-weight: 300; letter-spacing: 3px;
            color: rgba(0,212,255,0.8);
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
        }
        .hud-brand {
            font-size: 14px; font-weight: 700; letter-spacing: 6px;
            color: rgba(212,168,67,0.7);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212,168,67,0.3);
        }
        .hud-status {
            font-size: 10px; letter-spacing: 2px;
            color: rgba(0,255,136,0.6);
        }
        .hud-status .dot {
            display: inline-block; width: 6px; height: 6px;
            background: #0f8; border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px rgba(0,255,136,0.6);
            animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hud-data-block { text-align: right; }
        .hud-data-block .hud-value { font-size: 14px; }

        /* Center hint */
        .center-hint {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none;
            font-size: 11px; letter-spacing: 3px;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
            animation: fadeHint 3s ease-in-out infinite;
        }
        @keyframes fadeHint {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 600px) {
            .hud-overlay { padding: 16px; }
            .hud-brand { font-size: 11px; letter-spacing: 4px; }
            .hud-value { font-size: 14px; }
            .center-hint { bottom: 24px; font-size: 9px; }
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-overlay" id="loading-overlay">
    <div class="loading-ring"></div>
    <div class="loading-text" id="loading-status">INITIALIZING REACTOR</div>
    <div class="loading-error" id="loading-error"></div>
</div>

<!-- HUD Overlay -->
<div class="hud-overlay">
    <div class="hud-top">
        <div>
            <div class="hud-brand">Stark Industries</div>
            <div class="hud-status" style="margin-top:6px;"><span class="dot"></span>SYSTEM NOMINAL</div>
        </div>
        <div class="hud-data-block">
            <div class="hud-label">Power Output</div>
            <div class="hud-value" id="power-val">8.3 GJ/s</div>
        </div>
    </div>
    <div class="hud-bottom">
        <div>
            <div class="hud-label">Reactor Temp</div>
            <div class="hud-value" id="temp-val">3120 K</div>
        </div>
        <div class="hud-data-block">
            <div class="hud-label">Mark III Status</div>
            <div class="hud-value" style="color:rgba(0,255,136,0.7);">ARMOR READY</div>
        </div>
    </div>
</div>

<div class="center-hint">Click for Repulsor Blast</div>

<!-- Three.js Import Map — jsdelivr CDN (more reliable globally) -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">
// ===== Error Boundary — show errors on screen =====
const loadingOverlay = document.getElementById('loading-overlay');
const loadingStatus = document.getElementById('loading-status');
const loadingError = document.getElementById('loading-error');

function showError(msg) {
    loadingStatus.textContent = 'SYSTEM FAILURE';
    loadingError.textContent = msg;
    loadingError.style.display = 'block';
    loadingStatus.style.color = 'rgba(255,100,100,0.8)';
    console.error('[ARC REACTOR]', msg);
}

function hideLoading() {
    loadingOverlay.classList.add('hidden');
    setTimeout(() => loadingOverlay.remove(), 700);
}

try {
    loadingStatus.textContent = 'LOADING THREE.JS CORE';
    const THREE = await import('three');
    loadingStatus.textContent = 'ASSEMBLING REACTOR';

    // ===== SCENE SETUP =====
    const scene = new THREE.Scene();

    // ===== LIGHTING (set up first to ensure visibility) =====
    const ambient = new THREE.AmbientLight(0x334466, 4.0);
    scene.add(ambient);

    // Directional lights — key for Phong specular highlights
    const keyLight = new THREE.DirectionalLight(0xffffff, 3);
    keyLight.position.set(5, 3, 8);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x8899cc, 2);
    rimLight.position.set(-3, -1, -2);
    scene.add(rimLight);

    const reactorLight = new THREE.PointLight(0x00ccff, 120, 10, 1.5);
    reactorLight.position.set(0, 0, 0.2);
    scene.add(reactorLight);

    const goldLight = new THREE.PointLight(0xffaa44, 30, 6, 2);
    goldLight.position.set(0, 0, -0.5);
    scene.add(goldLight);

    // ===== RENDERER =====
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x080812, 1);
    document.body.appendChild(renderer.domElement);

    // ===== CAMERA =====
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 6.5);
    camera.lookAt(0, 0, 0);

    // ===== GLOW TEXTURES =====
    function createGlowTexture(innerColor, outerColor, size = 256) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
        gradient.addColorStop(0, innerColor);
        gradient.addColorStop(0.15, innerColor);
        gradient.addColorStop(0.5, outerColor);
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        return new THREE.CanvasTexture(canvas);
    }

    function createParticleTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.1, 'rgba(200,240,255,1)');
        gradient.addColorStop(0.4, 'rgba(0,200,255,0.6)');
        gradient.addColorStop(0.7, 'rgba(0,100,180,0.1)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
    }

    // =========================================
    // ARC REACTOR
    // =========================================
    const reactorGroup = new THREE.Group();
    scene.add(reactorGroup);

    // --- Outer Ring (Gold/Titanium) ---
    const outerRingGroup = new THREE.Group();
    reactorGroup.add(outerRingGroup);

    const outerTorusGeom = new THREE.TorusGeometry(1.15, 0.12, 32, 100);
    const outerTorusMat = new THREE.MeshPhongMaterial({
        color: 0xd4a843,
        specular: 0xffffff,
        shininess: 90,
    });
    outerRingGroup.add(new THREE.Mesh(outerTorusGeom, outerTorusMat));

    // Secondary recessed ring
    const outerRing2Geom = new THREE.TorusGeometry(1.15, 0.06, 16, 100);
    const outerRing2Mat = new THREE.MeshPhongMaterial({
        color: 0x886622,
        specular: 0xaa9944,
        shininess: 60,
        emissive: 0x332200,
    });
    const outerRing2 = new THREE.Mesh(outerRing2Geom, outerRing2Mat);
    outerRing2.rotation.x = Math.PI / 2;
    outerRingGroup.add(outerRing2);

    // --- Copper Coil Windings ---
    const coilGroup = new THREE.Group();
    outerRingGroup.add(coilGroup);

    const coilCount = 24;
    const coilGeom = new THREE.TorusGeometry(0.08, 0.025, 8, 12);
    const coilMat = new THREE.MeshPhongMaterial({
        color: 0xdd7733,
        specular: 0xffaa66,
        shininess: 50,
    });
    for (let i = 0; i < coilCount; i++) {
        const angle = (i / coilCount) * Math.PI * 2;
        const coil = new THREE.Mesh(coilGeom, coilMat);
        coil.position.x = Math.cos(angle) * 1.15;
        coil.position.y = Math.sin(angle) * 1.15;
        coil.rotation.z = angle + Math.PI / 2;
        coil.rotation.x = 0.5;
        coilGroup.add(coil);
    }

    // --- Middle Ring (Silver) ---
    const middleRingGeom = new THREE.TorusGeometry(0.85, 0.07, 32, 90);
    const middleRingMat = new THREE.MeshPhongMaterial({
        color: 0xccccdd,
        specular: 0xffffff,
        shininess: 80,
    });
    reactorGroup.add(new THREE.Mesh(middleRingGeom, middleRingMat));

    // --- Inner Glow Ring (Cyan) ---
    const innerGlowGroup = new THREE.Group();
    reactorGroup.add(innerGlowGroup);

    const innerRingGeom = new THREE.TorusGeometry(0.58, 0.09, 32, 80);
    const innerRingMat = new THREE.MeshPhongMaterial({
        color: 0x00ccff,
        specular: 0x88ddff,
        shininess: 30,
        emissive: 0x00aadd,
    });
    innerRingMat.emissiveIntensity = 2.5;
    innerGlowGroup.add(new THREE.Mesh(innerRingGeom, innerRingMat));

    // --- Reactor Glow Sprite ---
    const glowTex = createGlowTexture('rgba(150,240,255,1)', 'rgba(0,150,220,0)');
    const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
        transparent: true,
        opacity: 0.8,
    }));
    glowSprite.scale.set(3.5, 3.5, 1);
    glowSprite.position.z = -0.02;
    reactorGroup.add(glowSprite);

    // --- Center Flare ---
    const flareTex = createGlowTexture('rgba(255,255,255,1)', 'rgba(100,200,255,0)', 128);
    const flareSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: flareTex,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
        transparent: true,
        opacity: 0.9,
    }));
    flareSprite.scale.set(1.2, 1.2, 1);
    flareSprite.position.z = 0.06;
    reactorGroup.add(flareSprite);

    // --- Triangular Core ---
    const triGroup = new THREE.Group();
    reactorGroup.add(triGroup);

    function createTriangleGeom(radius, depth, bevel) {
        const shape = new THREE.Shape();
        shape.moveTo(0, radius);
        shape.lineTo(-radius * 0.8660254, -radius * 0.5);
        shape.lineTo(radius * 0.8660254, -radius * 0.5);
        shape.closePath();
        const geom = new THREE.ExtrudeGeometry(shape, {
            depth, bevelEnabled: true, bevelThickness: bevel,
            bevelSize: bevel * 0.5, bevelSegments: 2,
        });
        geom.center();
        return geom;
    }

    const triGeom = createTriangleGeom(0.18, 0.04, 0.015);
    const triMat = new THREE.MeshPhongMaterial({
        color: 0xffffff,
        specular: 0xffffff,
        shininess: 10,
        emissive: 0xddf8ff,
    });
    triMat.emissiveIntensity = 3.0;
    const triangleCore = new THREE.Mesh(triGeom, triMat);
    triangleCore.position.z = 0.04;
    triGroup.add(triangleCore);

    // Triangle glow shell
    const triGlowGeom = createTriangleGeom(0.22, 0.01, 0.02);
    const triGlowMat = new THREE.MeshBasicMaterial({
        color: 0x88eeff,
        transparent: true,
        opacity: 0.4,
        depthWrite: false,
    });
    const triGlow = new THREE.Mesh(triGlowGeom, triGlowMat);
    triGlow.position.z = 0.03;
    triGroup.add(triGlow);

    // --- Perimeter LEDs ---
    const ledCount = 12;
    const ledGeom = new THREE.SphereGeometry(0.02, 8, 8);
    const ledMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const leds = [];
    for (let i = 0; i < ledCount; i++) {
        const angle = (i / ledCount) * Math.PI * 2;
        const led = new THREE.Mesh(ledGeom, ledMat);
        led.position.set(Math.cos(angle) * 0.42, Math.sin(angle) * 0.42, 0.06);
        led.userData = { baseAngle: angle };
        reactorGroup.add(led);
        leds.push(led);
    }

    // =========================================
    // HUD SCANNER RINGS
    // =========================================
    const hudRings = [];
    function createHUDRing(radius, color, opacity, speed, tiltX = 0) {
        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(radius, 0.008, 8, 120),
            new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
        );
        ring.rotation.x = Math.PI / 2 + tiltX;
        ring.userData = { speed };
        scene.add(ring);
        hudRings.push(ring);
    }
    createHUDRing(2.0, 0x00aacc, 0.15, 0.15, 0.3);
    createHUDRing(2.2, 0x004466, 0.1, -0.1, 0.5);
    createHUDRing(1.7, 0x0088aa, 0.18, 0.2, 0.6);
    createHUDRing(2.5, 0x003355, 0.07, -0.07, 0.4);

    // =========================================
    // ARMOR FRAGMENTS (Nanotech)
    // =========================================
    const armorFragments = [];
    const armorGroup = new THREE.Group();
    scene.add(armorGroup);

    const armorColors = [
        { color: 0xaa2244, specular: 0xff8888, shininess: 60 },
        { color: 0xd4a843, specular: 0xffffcc, shininess: 90 },
        { color: 0x992233, specular: 0xdd6666, shininess: 50 },
        { color: 0xc89933, specular: 0xeedd99, shininess: 70 },
        { color: 0x883344, specular: 0xcc7777, shininess: 55 },
        { color: 0xbb9933, specular: 0xddcc88, shininess: 65 },
    ];

    for (let i = 0; i < 14; i++) {
        const size = 0.08 + Math.random() * 0.18;
        const geom = new THREE.IcosahedronGeometry(size, 1);
        // Distort vertices for organic armor look
        const pos = geom.attributes.position;
        for (let j = 0; j < pos.count; j++) {
            pos.setZ(j, pos.getZ(j) * (0.3 + Math.random() * 0.4));
            pos.setX(j, pos.getX(j) * (0.7 + Math.random() * 0.3));
            pos.setY(j, pos.getY(j) * (0.7 + Math.random() * 0.3));
        }
        geom.computeVertexNormals();

        const matCfg = armorColors[Math.floor(Math.random() * armorColors.length)];
        const mat = new THREE.MeshPhongMaterial(matCfg);
        const fragment = new THREE.Mesh(geom, mat);

        const phi = Math.random() * Math.PI;
        const theta = Math.random() * Math.PI * 2;
        const radius = 2.0 + Math.random() * 2.5;
        fragment.position.set(
            radius * Math.sin(phi) * Math.cos(theta),
            radius * Math.sin(phi) * Math.sin(theta),
            radius * Math.cos(phi) * 0.5 - 0.5
        );
        fragment.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        fragment.userData = {
            basePhi: phi, baseTheta: theta,
            orbitSpeed: 0.05 + Math.random() * 0.3,
            spinSpeed: [(Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02],
            floatAmp: 0.05 + Math.random() * 0.2,
            floatFreq: 0.5 + Math.random() * 1.5,
            floatOffset: Math.random() * Math.PI * 2,
            targetRadius: radius,
        };
        armorGroup.add(fragment);
        armorFragments.push(fragment);
    }

    // =========================================
    // PARTICLE SYSTEM
    // =========================================
    const particleCount = 600;
    const particleData = [];
    const particlePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const radius = 0.3 + Math.random() * 4.0;
        particlePositions[i*3] = Math.cos(angle) * Math.sin(phi) * radius;
        particlePositions[i*3+1] = Math.sin(angle) * Math.sin(phi) * radius;
        particlePositions[i*3+2] = Math.cos(phi) * radius * 0.6 - 0.2;
        particleData.push({
            baseRadius: radius, baseAngle: angle, basePhi: phi,
            life: Math.random(), lifeSpeed: 0.002 + Math.random() * 0.015,
            drift: (Math.random() - 0.5) * 0.003,
        });
    }

    const particleGeom = new THREE.BufferGeometry();
    particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleTex = createParticleTexture();
    const particles = new THREE.Points(particleGeom, new THREE.PointsMaterial({
        map: particleTex, color: 0x44ccff, size: 0.12,
        blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.7,
    }));
    scene.add(particles);

    // Gold ring particles
    const goldCount = 200;
    const goldData = [];
    const goldPositions = new Float32Array(goldCount * 3);
    for (let i = 0; i < goldCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 1.0 + Math.random() * 0.4;
        const z = (Math.random() - 0.5) * 0.3;
        goldPositions[i*3] = Math.cos(angle) * radius;
        goldPositions[i*3+1] = Math.sin(angle) * radius;
        goldPositions[i*3+2] = z;
        goldData.push({ baseRadius: radius, baseAngle: angle, speed: 0.3 + Math.random() * 0.6, zBase: z });
    }

    const goldParticleGeom = new THREE.BufferGeometry();
    goldParticleGeom.setAttribute('position', new THREE.BufferAttribute(goldPositions, 3));
    const goldParticles = new THREE.Points(goldParticleGeom, new THREE.PointsMaterial({
        map: particleTex, color: 0xffaa44, size: 0.06,
        blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.5,
    }));
    scene.add(goldParticles);

    // =========================================
    // REPULSOR BLAST
    // =========================================
    const blastParticles = [];
    const blastGroup = new THREE.Group();
    blastGroup.visible = false;
    scene.add(blastGroup);

    function triggerRepulsorBlast() {
        for (let i = 0; i < 40; i++) {
            const blob = new THREE.Mesh(
                new THREE.SphereGeometry(0.02 + Math.random() * 0.03, 4, 4),
                new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(0.55 + Math.random() * 0.1, 1, 0.5 + Math.random() * 0.5),
                    transparent: true, opacity: 1, depthWrite: false,
                })
            );
            blob.position.set(0, 0, 0.1);
            const angle = Math.random() * Math.PI * 2;
            const spread = 0.3 + Math.random() * 0.6;
            blob.userData = {
                velocity: new THREE.Vector3(
                    Math.cos(angle) * spread * 0.3,
                    Math.sin(angle) * spread * 0.3,
                    0.5 + Math.random() * 1.2
                ),
                life: 1.0,
                decay: 0.015 + Math.random() * 0.04,
            };
            blastGroup.add(blob);
            blastParticles.push(blob);
        }
        blastGroup.visible = true;
        reactorLight.intensity = 200;
        flareSprite.material.opacity = 1;
    }

    // =========================================
    // INTERACTION
    // =========================================
    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };

    window.addEventListener('mousemove', (e) => {
        mouse.tx = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.ty = -(e.clientY / window.innerHeight) * 2 + 1;
    });
    window.addEventListener('touchmove', (e) => {
        mouse.tx = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
        mouse.ty = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
    }, { passive: true });
    window.addEventListener('click', triggerRepulsorBlast);

    // =========================================
    // ANIMATION LOOP
    // =========================================
    const clock = new THREE.Clock();

    function animate(ts) {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.1);
        const t = ts * 0.001;

        // Smooth mouse
        mouse.x += (mouse.tx - mouse.x) * 0.03;
        mouse.y += (mouse.ty - mouse.y) * 0.03;

        // Reactor follows mouse
        reactorGroup.rotation.y += (mouse.x * 0.3 - reactorGroup.rotation.y) * 0.02;
        reactorGroup.rotation.x += (-mouse.y * 0.2 - reactorGroup.rotation.x) * 0.02;

        // Camera parallax
        camera.position.x += (mouse.x * 0.6 - camera.position.x) * 0.015;
        camera.position.y += (0.2 + mouse.y * 0.4 - camera.position.y) * 0.015;
        camera.lookAt(0, 0, 0);

        // Reactor pulse
        const pulse = 1 + Math.sin(t * 3.5) * 0.15 + Math.sin(t * 7.3) * 0.08;
        reactorLight.intensity += (80 * pulse - reactorLight.intensity) * 0.1;
        flareSprite.material.opacity += (0.7 + Math.sin(t * 3.5) * 0.2 - flareSprite.material.opacity) * 0.1;

        // Triangle emissive pulse
        triMat.emissiveIntensity = 2.5 + Math.sin(t * 3.5) * 0.8 + Math.sin(t * 7.1) * 0.3;
        triGlowMat.opacity = 0.3 + Math.sin(t * 3.5) * 0.15;

        // Rings
        innerGlowGroup.rotation.z += dt * 0.4;
        coilGroup.rotation.z += dt * 0.15;

        // LEDs pulse
        leds.forEach(led => {
            const phase = Math.sin(t * 5 + led.userData.baseAngle * 5) * 0.4 + 0.6;
            led.material.opacity = phase;
            led.scale.setScalar(0.8 + phase * 0.4);
        });

        // HUD rings
        hudRings.forEach(r => { r.rotation.z += r.userData.speed * dt; });

        // Armor fragments
        armorFragments.forEach(f => {
            const ud = f.userData;
            ud.baseTheta += ud.orbitSpeed * dt;
            const fl = Math.sin(t * ud.floatFreq + ud.floatOffset) * ud.floatAmp;
            const r = ud.targetRadius + fl;
            f.position.set(
                r * Math.sin(ud.basePhi) * Math.cos(ud.baseTheta),
                r * Math.sin(ud.basePhi) * Math.sin(ud.baseTheta),
                r * Math.cos(ud.basePhi) * 0.5 - 0.5
            );
            f.rotation.x += ud.spinSpeed[0];
            f.rotation.y += ud.spinSpeed[1];
            f.rotation.z += ud.spinSpeed[2];
        });
        armorGroup.rotation.y += dt * 0.06;
        armorGroup.rotation.x += dt * 0.02;

        // Particles
        const pp = particles.geometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
            const pd = particleData[i];
            pd.life += pd.lifeSpeed;
            if (pd.life >= 1) pd.life = 0;
            const r = pd.baseRadius + pd.life * 2.5;
            const a = pd.baseAngle + pd.life * Math.PI;
            const phi = pd.basePhi + pd.life * pd.drift;
            pp[i*3] = Math.cos(a) * Math.sin(phi) * r;
            pp[i*3+1] = Math.sin(a) * Math.sin(phi) * r;
            pp[i*3+2] = Math.cos(phi) * r * 0.6 - 0.2;
        }
        particles.geometry.attributes.position.needsUpdate = true;

        const gp = goldParticles.geometry.attributes.position.array;
        for (let i = 0; i < goldCount; i++) {
            const gd = goldData[i];
            gd.baseAngle += gd.speed * dt;
            gp[i*3] = Math.cos(gd.baseAngle) * gd.baseRadius;
            gp[i*3+1] = Math.sin(gd.baseAngle) * gd.baseRadius;
            gp[i*3+2] = gd.zBase + Math.sin(t * 2 + gd.baseAngle) * 0.05;
        }
        goldParticles.geometry.attributes.position.needsUpdate = true;

        // Blast particles
        for (let i = blastParticles.length - 1; i >= 0; i--) {
            const bp = blastParticles[i];
            bp.userData.life -= bp.userData.decay;
            bp.material.opacity = Math.max(0, bp.userData.life);
            bp.position.add(bp.userData.velocity.clone().multiplyScalar(dt * 5));
            bp.scale.multiplyScalar(0.985);
            if (bp.userData.life <= 0) {
                blastGroup.remove(bp);
                bp.geometry.dispose();
                bp.material.dispose();
                blastParticles.splice(i, 1);
            }
        }
        if (blastParticles.length === 0) blastGroup.visible = false;

        // Fade reactor flash
        if (reactorLight.intensity > 80) {
            reactorLight.intensity += (80 - reactorLight.intensity) * 0.05;
        }

        // HUD telemetry
        document.getElementById('power-val').textContent =
            (8.0 + Math.sin(t * 3.5) * 0.5 + Math.sin(t * 0.7) * 0.2).toFixed(1) + ' GJ/s';
        document.getElementById('temp-val').textContent =
            Math.round(3100 + Math.sin(t * 3.5) * 40 + Math.sin(t * 1.3) * 20) + ' K';

        renderer.render(scene, camera);

        // Hide loading after first frame renders
        if (!animate._firstFrame) {
            animate._firstFrame = true;
            hideLoading();
        }
    }

    // ===== RESIZE =====
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== START =====
    requestAnimationFrame(animate);

} catch (err) {
    showError('Three.js failed to initialize.\n\n' + err.message + '\n\nTry opening your browser console for details.');
    throw err;
}
</script>
</body>
</html>
