<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020810">
<title>J.A.R.V.I.S. — Arc Reactor Mk IV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #020810;
  overflow: hidden;
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: crosshair;
}

canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }

#loading {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #020810;
  transition: opacity 0.6s;
}
#loading.hide { opacity: 0; pointer-events: none; }
#loading .ring {
  width: 50px; height: 50px;
  border: 1.5px solid rgba(0,180,255,0.2);
  border-top-color: rgba(0,200,255,0.9);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 18px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading .txt {
  font-size: 10px; letter-spacing: 3px; color: rgba(0,180,255,0.6);
  text-transform: uppercase;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
}
#loading .err { display: none; color: #f66; font-size: 11px; margin-top: 12px; text-align: center; max-width: 320px; line-height: 1.6; }

.hud {
  position: fixed; inset: 0; pointer-events: none; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: clamp(12px, 3vw, 28px);
}
.hud-row { display: flex; justify-content: space-between; align-items: flex-start; }
.hud-row.end { align-items: flex-end; }
.hud-brand {
  font-size: clamp(11px, 2vw, 15px); font-weight: 700;
  letter-spacing: 5px; color: rgba(180,160,100,0.7);
  text-transform: uppercase;
  text-shadow: 0 0 24px rgba(180,150,80,0.25);
}
.hud-stat { text-align: right; }
.hud-label {
  font-size: 9px; letter-spacing: 2px; color: rgba(0,180,255,0.45);
  text-transform: uppercase;
}
.hud-val {
  font-size: clamp(13px, 2.5vw, 20px); font-weight: 300; letter-spacing: 2px;
  color: rgba(0,200,255,0.8);
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-variant-numeric: tabular-nums;
}
.hud-status { font-size: 10px; letter-spacing: 2px; color: rgba(0,255,120,0.55); }
.hud-status .dot {
  display: inline-block; width: 5px; height: 5px;
  background: #0f8; border-radius: 50%; margin-right: 6px;
  box-shadow: 0 0 6px rgba(0,255,120,0.5);
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.hint {
  position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
  z-index: 10; pointer-events: none;
  font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.18);
  text-transform: uppercase;
  animation: hintFade 3s ease-in-out infinite;
}
@keyframes hintFade { 0%,100%{opacity:0.15} 50%{opacity:0.45} }
.mode-toggle {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 20; display: flex; gap: 8px;
}
.mode-btn {
  padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(0,180,255,0.3);
  background: rgba(0,20,40,0.7); color: rgba(0,180,255,0.7);
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  cursor: pointer; pointer-events: all;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
.mode-btn:hover { border-color: rgba(0,200,255,0.6); color: rgba(0,220,255,0.9); }
.mode-btn.active {
  border-color: rgba(0,220,255,0.8); color: #fff;
  background: rgba(0,140,220,0.2);
  box-shadow: 0 0 16px rgba(0,180,255,0.2);
}
@media (max-width: 600px) {
  .hud { padding: 14px; }
  .hint { bottom: 20px; font-size: 8px; }
  .mode-toggle { bottom: 52px; gap: 4px; }
  .mode-btn { padding: 6px 12px; font-size: 8px; letter-spacing: 1px; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="ring"></div>
  <div class="txt" id="load-txt">Initializing Reactor</div>
  <div class="err" id="load-err"></div>
</div>

<div class="hud">
  <div class="hud-row">
    <div>
      <div class="hud-brand">Stark Industries</div>
      <div class="hud-status" style="margin-top:4px"><span class="dot"></span>ARC REACTOR Mk IV — NOMINAL</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">Power Output</div>
      <div class="hud-val" id="power">8.4 GJ/s</div>
    </div>
  </div>
  <div class="hud-row end">
    <div>
      <div class="hud-label">Core Temp</div>
      <div class="hud-val" id="temp">3140 K</div>
    </div>
    <div class="hud-stat">
      <div class="hud-label">New Element — Badassium</div>
      <div class="hud-val" style="color:rgba(0,255,120,0.7)">STABLE</div>
    </div>
  </div>
</div>

<div class="hint" id="mode-hint">Click — Repulsor Test Fire</div>

<div class="mode-toggle">
  <button class="mode-btn active" id="btn-reactor">⚡ Reactor</button>
  <button class="mode-btn" id="btn-suit">🛡️ Mk50</button>
  <button class="mode-btn" id="btn-helmet">🪖 Helmet</button>
  <button class="mode-btn" id="btn-mk85">⚜️ Mk85</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
const loadEl = document.getElementById('loading');
const loadTxt = document.getElementById('load-txt');
const loadErr = document.getElementById('load-err');

function fail(msg) {
  loadTxt.textContent = 'Reactor Offline';
  loadTxt.style.color = '#f66';
  loadErr.textContent = msg;
  loadErr.style.display = 'block';
  console.error(msg);
}

try {
  loadTxt.textContent = 'Loading Three.js Core';
  const THREE = await import('three');
  const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
  const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
  const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');
  loadTxt.textContent = 'Assembling Arc Reactor';

  const scene = new THREE.Scene();

  // Procedural Environment Map — makes metals reflect light properly
  const pmremRenderer = new THREE.WebGLRenderer({ antialias: true });
  const pmrem = new THREE.PMREMGenerator(pmremRenderer);
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x112244);
  [
    { color: 0xaaccff, pos: [0, 20, 0], size: 40 },
    { color: 0xffddaa, pos: [-15, 0, 15], size: 25 },
    { color: 0xffffff, pos: [10, 8, 10], size: 20 },
    { color: 0x8899cc, pos: [-5, -10, 5], size: 30 },
  ].forEach(cfg => {
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(cfg.size, cfg.size),
      new THREE.MeshBasicMaterial({ color: cfg.color, side: THREE.DoubleSide })
    );
    plane.position.set(...cfg.pos);
    envScene.add(plane);
  });
  const envTex = pmrem.fromScene(envScene, 0.04).texture;
  scene.environment = envTex;
  scene.background = new THREE.Color(0x020810);
  pmremRenderer.dispose();

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x020810, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.15, 5.5);
  camera.lookAt(0, 0, 0);

  // ── Bloom Post-Processing (must be after camera) ──
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.22,  // strength — glow intensity
    0.4,   // radius — glow spread
    0.78   // threshold — only very bright areas bloom
  );
  composer.addPass(bloomPass);

  // ── Starfield ──
  const starCount = 800;
  const starGeom = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 8 + Math.random() * 20;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    starPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    starPositions[i*3+2] = r * Math.cos(phi);
  }
  starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const stars = new THREE.Points(starGeom, new THREE.PointsMaterial({
    color: 0x8899cc, size: 0.04, transparent: true, opacity: 0.6,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  scene.add(stars);

  // Lighting
  const sceneAmbient = new THREE.AmbientLight(0x334466, 2.5);
  scene.add(sceneAmbient);
  const keyLight = new THREE.DirectionalLight(0xffffff, 4);
  keyLight.position.set(6, 4, 8);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x8899cc, 2);
  fillLight.position.set(-4, -1, 2);
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0xffccaa, 3);
  rimLight.position.set(0, -3, -2);
  scene.add(rimLight);
  const coreLight = new THREE.PointLight(0x88ccff, 100, 6, 2);
  coreLight.position.set(0, 0, 0.15);
  scene.add(coreLight);
  const goldRimLight = new THREE.PointLight(0xffaa44, 20, 4, 2);
  goldRimLight.position.set(0, 0, -0.3);
  scene.add(goldRimLight);

  // Glow textures
  function glowTex(inner, outer, size = 256) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, inner); g.addColorStop(0.12, inner);
    g.addColorStop(0.45, outer); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  function particleTex() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.08, 'rgba(200,240,255,1)');
    g.addColorStop(0.35, 'rgba(0,180,255,0.5)');
    g.addColorStop(0.7, 'rgba(0,80,160,0.05)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }

  // ═══ ARC REACTOR Mk IV ═══
  const reactor = new THREE.Group();
  scene.add(reactor);

  // Outer Housing (Gold-Titanium)
  reactor.add(new THREE.Mesh(
    new THREE.TorusGeometry(1.1, 0.14, 32, 120),
    new THREE.MeshStandardMaterial({ color: 0xc8a050, metalness: 0.95, roughness: 0.18 })
  ));
  reactor.add(new THREE.Mesh(
    new THREE.TorusGeometry(0.96, 0.06, 16, 100),
    new THREE.MeshStandardMaterial({ color: 0x997733, metalness: 0.9, roughness: 0.3 })
  ));

  // Copper Coil Windings
  const coilGroup = new THREE.Group();
  reactor.add(coilGroup);
  const coilGeom = new THREE.TorusGeometry(0.07, 0.022, 8, 14);
  const coilMat = new THREE.MeshStandardMaterial({ color: 0xdd7733, metalness: 0.85, roughness: 0.35 });
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const coil = new THREE.Mesh(coilGeom, coilMat);
    coil.position.set(Math.cos(a) * 1.03, Math.sin(a) * 1.03, 0);
    coil.rotation.set(0.45, 0.15, a + Math.PI / 2);
    coilGroup.add(coil);
  }

  // Support Ring (Silver)
  reactor.add(new THREE.Mesh(
    new THREE.TorusGeometry(0.78, 0.05, 24, 90),
    new THREE.MeshStandardMaterial({ color: 0xccd0d8, metalness: 0.9, roughness: 0.25 })
  ));
  // Inner track
  reactor.add(new THREE.Mesh(
    new THREE.TorusGeometry(0.62, 0.03, 16, 90),
    new THREE.MeshStandardMaterial({ color: 0x333840, metalness: 0.8, roughness: 0.5 })
  ));

  // ── INVERTED TRIANGLE CORE ──
  const coreGroup = new THREE.Group();
  reactor.add(coreGroup);

  function triShape(r) {
    const s = new THREE.Shape();
    s.moveTo(0, -r);  // point DOWN
    s.lineTo(r * 0.8660254, r * 0.5);
    s.lineTo(-r * 0.8660254, r * 0.5);
    s.closePath();
    return s;
  }
  function triExtrude(r, depth, bevel) {
    const g = new THREE.ExtrudeGeometry(triShape(r), {
      depth, bevelEnabled: true, bevelThickness: bevel,
      bevelSize: bevel * 0.5, bevelSegments: 3,
    });
    g.center();
    return g;
  }

  // Gold triangle frame
  const frameGeom = triExtrude(0.28, 0.06, 0.02);
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xc8a050, metalness: 0.95, roughness: 0.18 });
  const frame = new THREE.Mesh(frameGeom, frameMat);
  frame.position.z = 0.03;
  coreGroup.add(frame);

  // Glowing inner triangle
  const innerTriGeom = triExtrude(0.2, 0.03, 0.01);
  const innerTriMat = new THREE.MeshStandardMaterial({
    color: 0xeeffff, metalness: 0.0, roughness: 0.05,
    emissive: 0xccf0ff, emissiveIntensity: 3.5,
  });
  const innerTri = new THREE.Mesh(innerTriGeom, innerTriMat);
  innerTri.position.z = 0.05;
  coreGroup.add(innerTri);

  // Glass cover
  const cover = new THREE.Mesh(
    new THREE.ShapeGeometry(triShape(0.32)),
    new THREE.MeshPhysicalMaterial({ color: 0xaaddff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.25, depthWrite: false })
  );
  cover.position.z = 0.09;
  coreGroup.add(cover);

  // Glow Sprites
  const bigGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex('rgba(160,220,255,0.9)', 'rgba(0,140,220,0)'),
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true, opacity: 0.65,
  }));
  bigGlow.scale.set(3.2, 3.2, 1);
  bigGlow.position.z = -0.05;
  reactor.add(bigGlow);

  const centerFlare = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex('rgba(255,255,255,1)', 'rgba(100,200,255,0)', 128),
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true, opacity: 0.85,
  }));
  centerFlare.scale.set(0.9, 0.9, 1);
  centerFlare.position.z = 0.1;
  reactor.add(centerFlare);

  // Mounting Bracket Arms (3-point)
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2;
    const arm = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.06, 0.35, 8),
      new THREE.MeshStandardMaterial({ color: 0x555566, metalness: 0.85, roughness: 0.35 })
    );
    arm.position.set(Math.cos(a) * 1.25, Math.sin(a) * 1.25, -0.15);
    arm.rotation.set(0, -a, Math.PI / 2);
    reactor.add(arm);
  }

  // HUD Scanner Rings
  const hudRings = [];
  function hudRing(radius, color, opacity, speed, tiltX = 0) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(radius, 0.006, 8, 140),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
    );
    ring.rotation.x = Math.PI / 2 + tiltX;
    ring.userData = { speed };
    scene.add(ring);
    hudRings.push(ring);
  }
  hudRing(1.8, 0x0088cc, 0.13, 0.12, 0.25);
  hudRing(2.0, 0x005588, 0.08, -0.09, 0.45);
  hudRing(1.5, 0x0099bb, 0.16, 0.18, 0.55);
  hudRing(2.3, 0x004466, 0.05, -0.06, 0.35);

  // Energy Particles
  const pCount = 500;
  const pData = [];
  const pPos = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI * 0.6;
    const r = 0.15 + Math.random() * 3.5;
    pPos[i*3]=Math.cos(a)*Math.sin(phi)*r;
    pPos[i*3+1]=Math.sin(a)*Math.sin(phi)*r;
    pPos[i*3+2]=Math.cos(phi)*r*0.5+0.1;
    pData.push({ r, a, phi, life: Math.random(), ls: 0.002+Math.random()*0.012, drift: (Math.random()-0.5)*0.002 });
  }
  const pGeom = new THREE.BufferGeometry();
  pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pts = new THREE.Points(pGeom, new THREE.PointsMaterial({
    map: particleTex(), color: 0x44bbff, size: 0.1,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.65,
  }));
  scene.add(pts);

  // Gold ring particles
  const gpCount = 150;
  const gpData = [];
  const gpPos = new Float32Array(gpCount * 3);
  for (let i = 0; i < gpCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.95 + Math.random() * 0.35;
    const z = (Math.random() - 0.5) * 0.2;
    gpPos[i*3]=Math.cos(a)*r;
    gpPos[i*3+1]=Math.sin(a)*r;
    gpPos[i*3+2]=z;
    gpData.push({ r, a, s: 0.25+Math.random()*0.5, zB: z });
  }
  const gpGeom = new THREE.BufferGeometry();
  gpGeom.setAttribute('position', new THREE.BufferAttribute(gpPos, 3));
  const gp = new THREE.Points(gpGeom, new THREE.PointsMaterial({
    map: particleTex(), color: 0xffaa44, size: 0.05,
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.45,
  }));
  scene.add(gp);

  // ── MODE STATE ──
  let currentMode = 'reactor'; // 'reactor' | 'suit' | 'cg' | 'helmet' | 'mk85'
  const btnReactor = document.getElementById('btn-reactor');
  const btnSuit = document.getElementById('btn-suit');
  const btnHelmet = document.getElementById('btn-helmet');
  const btnMk85 = document.getElementById('btn-mk85');
  const modeHint = document.getElementById('mode-hint');
  const allButtons = [btnReactor, btnSuit, btnHelmet, btnMk85];

  function hideAllModels() {
    reactor.visible = false; glbGroup.visible = false;
    suitGroup.visible = false; helmetGroup.visible = false;
    mk85Group.visible = false;
    pts.visible = false; gp.visible = false;
    hudRings.forEach(r => r.visible = false);
    coreLight.visible = false; goldRimLight.visible = false;
  }

  function setMode(mode) {
    currentMode = mode;
    allButtons.forEach(b => b.classList.remove('active'));
    hideAllModels();
    if (mode === 'reactor') {
      btnReactor.classList.add('active');
      reactor.visible = true; glbGroup.visible = true;
      pts.visible = true; gp.visible = true;
      hudRings.forEach(r => r.visible = true);
      coreLight.visible = true; goldRimLight.visible = true;
      sceneAmbient.intensity = 2.5;
      scene.background = new THREE.Color(0x020810);
      modeHint.textContent = 'Click — Repulsor Test Fire';
    } else if (mode === 'suit') {
      btnSuit.classList.add('active');
      suitGroup.visible = true;
      sceneAmbient.intensity = 1.0;
      scene.background = new THREE.Color(0x000000);
      modeHint.textContent = 'Drag to Rotate — Mark 50';
    } else if (mode === 'helmet') {
      btnHelmet.classList.add('active');
      helmetGroup.visible = true;
      sceneAmbient.intensity = 0.08;
      scene.background = new THREE.Color(0x000000);
      modeHint.textContent = 'Drag to Rotate — Iron Man Helmet';
    } else {
      btnMk85.classList.add('active');
      mk85Group.visible = true;
      sceneAmbient.intensity = 0.05;
      scene.background = new THREE.Color(0x020206);
      modeHint.textContent = 'Drag to Rotate — Mark 85';
    }
  }
  btnReactor.addEventListener('click', () => setMode('reactor'));
  btnSuit.addEventListener('click', () => setMode('suit'));
  btnHelmet.addEventListener('click', () => setMode('helmet'));
  btnMk85.addEventListener('click', () => setMode('mk85'));

  // ── LOAD GLB Arc Reactor Model (Iron Man 2 — film-accurate) ──
  const glbGroup = new THREE.Group();
  reactor.add(glbGroup);

  const gltfLoader = new GLTFLoader();
  gltfLoader.load(
    '/models/arc_reactor_mk2.glb',
    (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const targetSize = 2.4;
      const s = targetSize / maxDim;
      model.scale.setScalar(s);
      model.position.set(-center.x * s, -center.y * s, -center.z * s);
      model.traverse(child => {
        if (child.isMesh && child.material) {
          if (child.material.emissive) child.material.emissiveIntensity = (child.material.emissiveIntensity || 0.3) * 1.8;
          child.material.needsUpdate = true;
        }
      });
      glbGroup.add(model);
      console.log('[REACTOR] GLB loaded —', `scale=${s.toFixed(3)}, meshes=${gltf.scene.children.length}`);
    },
    (p) => { if (p.total > 0) loadTxt.textContent = `Reactor Model ${Math.round(p.loaded/p.total*100)}%`; },
    (err) => { console.warn('[REACTOR] GLB failed:', err?.message || err); }
  );

  // ── LOAD Mark 50 Suit FBX Model ──
  const suitGroup = new THREE.Group();
  suitGroup.visible = false;
  scene.add(suitGroup);

  const suitLoader = new FBXLoader();
  suitLoader.load(
    '/models/mark50/make_iron_man_mark_50_0225152532_texture.fbx',
    (object) => {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const targetSize = 2.5;
      const s = targetSize / maxDim;
      object.scale.setScalar(s);
      object.position.set(-center.x * s, -center.y * s + 0.2, -center.z * s);

      // ── Suit Material Tuning: Deep Red + Dark Metals ──
      object.traverse(child => {
        if (!child.isMesh || !child.material) return;
        const materials = Array.isArray(child.material) ? child.material : [child.material];

        materials.forEach(m => {
          const c = new THREE.Color(m.color || 0x888888);
          const hsl = {};
          c.getHSL(hsl);

          const isRed = (hsl.h < 0.08 || hsl.h > 0.92) && hsl.s > 0.15;
          const isGold = hsl.h > 0.08 && hsl.h < 0.18 && hsl.s > 0.2;

          if (isRed) {
            c.offsetHSL(0, 0.3, -0.25); // deep crimson
            m.color = c;
            if (m.metalness !== undefined) m.metalness = Math.max(0.15, m.metalness * 0.4);
            if (m.roughness !== undefined) m.roughness = Math.max(0.5, m.roughness);
          } else if (isGold) {
            c.offsetHSL(0.08, -0.15, -0.2);
            m.color = c;
            if (m.metalness !== undefined) m.metalness = Math.max(0.2, m.metalness * 0.3);
          } else {
            // Darken everything else heavily
            c.offsetHSL(0, -0.15, -0.25);
            m.color = c;
            if (m.metalness !== undefined) m.metalness = Math.max(0.05, m.metalness * 0.3);
            if (m.roughness !== undefined) m.roughness = Math.min(0.95, m.roughness + 0.25);
          }

          if (m.emissiveIntensity !== undefined) {
            m.emissiveIntensity *= 0.3;
          }

          m.needsUpdate = true;
        });
      });

      suitGroup.add(object);
      console.log('[SUIT] Mark 50 FBX loaded — tuned: redder, less bright');
    },
    (p) => { if (p.total > 0) loadTxt.textContent = `Suit Model ${Math.round(p.loaded/p.total*100)}%`; },
    (err) => { console.warn('[SUIT] Mark 50 FBX failed:', err?.message || err); }
  );

  // ── LOAD Iron Man Helmet FBX Model ──
  const helmetGroup = new THREE.Group();
  helmetGroup.visible = false;
  scene.add(helmetGroup);

  // Manually load all PBR textures (FBXLoader can't map them to Standard material slots)
  const texLoader = new THREE.TextureLoader();
  const TEX = '/models/helmet/source/';

  function loadTex(filename, srgb = true) {
    return new Promise((resolve) => {
      texLoader.load(TEX + filename,
        (t) => { t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.LinearSRGBColorSpace; t.flipY = false; resolve(t); },
        undefined, () => resolve(null)
      );
    });
  }

  // Load all textures in parallel
  const allHelmetTextures = Promise.all([
    // head
    loadTex('head_BaseColor.png', true),   // 0
    loadTex('head_Metallic.png', false),    // 1
    loadTex('head_Roughness.png', false),   // 2
    loadTex('head_Normal.png', false),      // 3
    // eyes
    loadTex('eyeand_other_BaseColor.png', true),  // 4
    loadTex('eyeand_other_Metallic.png', false),   // 5
    loadTex('eyeand_other_Roughness.png', false),  // 6
    loadTex('eyeand_other_Normal.png', false),     // 7
    loadTex('eyeand_other_Emission.png', true),    // 8
    // default
    loadTex('DefaultMaterial_BaseColor.jpg', true),   // 9
    loadTex('DefaultMaterial_Roughness.jpg', false),  // 10
    loadTex('DefaultMaterial_Normal.jpg', false),     // 11
  ]);

  const helmetLoader = new FBXLoader();
  helmetLoader.setResourcePath(TEX);
  helmetLoader.load(
    '/models/helmet/source/iron man_scene.fbx',
    async (object) => {
      // Wait for all textures to load
      const tex = await allHelmetTextures;
      const [hBC, hM, hR, hN, eBC, eM, eR, eN, eEm, dBC, dR, dN] = tex;

      // Remove ground planes / bounding box helpers / cameras / lights from FBX
      const toRemove = [];
      object.traverse(child => {
        const name = child.name.toLowerCase();
        // Skip non-mesh junk often included in FBX exports
        if (child.isMesh) {
          // Hide huge flat planes (ground/backdrop)
          if (child.geometry) {
            child.geometry.computeBoundingBox();
            const bb = child.geometry.boundingBox;
            const dim = bb.getSize(new THREE.Vector3());
            const area = dim.x * dim.y;
            if (area > 50 || (dim.z < 0.01 && area > 4)) {
              toRemove.push(child);
              return;
            }
          }
        }
        if (!child.isMesh && !child.isGroup && !child.isObject3D) {
          // Remove lights/cameras from FBX
          if (child.isLight || child.isCamera) toRemove.push(child);
        }
      });
      toRemove.forEach(c => c.removeFromParent());
      if (toRemove.length) console.log('[HELMET] Removed', toRemove.length, 'junk objects:', toRemove.map(c => c.name || c.type));

      // Scale & center — use HELMET-ONLY bounding box for accurate sizing
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const targetSize = 10; // fill the screen
      const s = targetSize / (maxDim || 1);
      object.scale.setScalar(s);
      object.position.set(-center.x * s, -center.y * s + 0.6, -center.z * s);

      // Replace ALL materials with PBR
      object.traverse(child => {
        if (!child.isMesh) return;
        const name = (child.name + (child.material?.name || '')).toLowerCase();
        const isEye = name.includes('eye');

        let mat;
        if (isEye) {
          mat = new THREE.MeshStandardMaterial({
            map: eBC, metalnessMap: eM, roughnessMap: eR,
            normalMap: eN, emissiveMap: eEm,
            color: 0xffffff, metalness: 0.05, roughness: 0.45,
            emissive: 0xddeeff, emissiveIntensity: 3.5,
          });
        } else if (name.includes('head')) {
          mat = new THREE.MeshStandardMaterial({
            map: hBC, metalnessMap: hM, roughnessMap: hR, normalMap: hN,
            color: 0xcc8888, metalness: 0.85, roughness: 0.22,
          });
        } else {
          mat = new THREE.MeshStandardMaterial({
            map: dBC || hBC, roughnessMap: dR || hR, normalMap: dN || hN,
            color: 0xaa7777, metalness: 0.8, roughness: 0.3,
          });
        }
        child.material = mat;
      });

      helmetGroup.add(object);

      // Strong dedicated lighting for helmet mode
      helmetGroup.add(new THREE.AmbientLight(0x112233, 0.5));
      const k = new THREE.DirectionalLight(0xffffff, 3);
      k.position.set(3, 2, 7); helmetGroup.add(k);
      const f = new THREE.DirectionalLight(0x8899cc, 1.2);
      f.position.set(-3, 0, 2); helmetGroup.add(f);
      const r = new THREE.DirectionalLight(0xffccbb, 1.5);
      r.position.set(0, -4, -3); helmetGroup.add(r);

      console.log('[HELMET] PBR ready —',
        `scale=${s.toFixed(2)}, size=${maxDim.toFixed(1)}→${targetSize}, ` +
        `textures=${tex.filter(Boolean).length}/${tex.length}`
      );
    },
    (p) => { if (p.total > 0) loadTxt.textContent = `Helmet ${Math.round(p.loaded/p.total*100)}%`; },
    (err) => { console.warn('[HELMET] FBX failed:', err?.message || err); }
  );

  // ── LOAD Mark 85 GLB Model (Nanotech — Endgame) ──
  const mk85Group = new THREE.Group();
  mk85Group.visible = false;
  scene.add(mk85Group);

  const mk85Loader = new GLTFLoader();
  mk85Loader.load(
    '/models/mk85.glb',
    (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const targetSize = 2.8;
      const s = targetSize / maxDim;
      model.scale.setScalar(s);
      model.position.set(-center.x * s, -center.y * s + 0.1, -center.z * s);

      // ── Mk85 Material Tuning: Crimson Red + Warm Gold + Dark Metals ──
      model.traverse(child => {
        if (!child.isMesh || !child.material) return;
        const materials = Array.isArray(child.material) ? child.material : [child.material];

        materials.forEach(m => {
          const c = new THREE.Color(m.color || 0x888888);
          const hsl = {};
          c.getHSL(hsl);

          const isRed = (hsl.h < 0.08 || hsl.h > 0.92) && hsl.s > 0.12;
          const isGold = hsl.h > 0.08 && hsl.h < 0.20 && hsl.s > 0.15;

          if (isRed) {
            c.offsetHSL(0, 0.35, -0.30); // deep crimson
            m.color = c;
            if (m.metalness !== undefined) m.metalness = Math.max(0.2, m.metalness * 0.5);
            if (m.roughness !== undefined) m.roughness = Math.max(0.4, m.roughness);
          } else if (isGold) {
            c.offsetHSL(0.05, -0.10, -0.15); // warm gold
            m.color = c;
            if (m.metalness !== undefined) m.metalness = Math.max(0.3, m.metalness * 0.4);
          } else {
            c.offsetHSL(0, -0.2, -0.35);
            m.color = c;
            if (m.metalness !== undefined) m.metalness = Math.max(0.05, m.metalness * 0.3);
            if (m.roughness !== undefined) m.roughness = Math.min(0.95, m.roughness + 0.3);
          }

          if (m.emissiveIntensity !== undefined) {
            m.emissiveIntensity *= 0.2;
          }

          m.needsUpdate = true;
        });
      });

      // Subtle dedicated lighting
      mk85Group.add(new THREE.AmbientLight(0x112233, 0.4));
      const mkKey = new THREE.DirectionalLight(0xffffff, 3);
      mkKey.position.set(3, 2, 7); mk85Group.add(mkKey);
      const mkFill = new THREE.DirectionalLight(0x8899cc, 1);
      mkFill.position.set(-3, 0, 2); mk85Group.add(mkFill);
      const mkRim = new THREE.DirectionalLight(0xffccbb, 1.5);
      mkRim.position.set(0, -4, -3); mk85Group.add(mkRim);

      mk85Group.add(model);
      console.log('[MK85] GLB loaded —', `scale=${s.toFixed(2)}, size=${maxDim.toFixed(1)}→${targetSize}`);
    },
    (p) => { if (p.total > 0) loadTxt.textContent = `Mk85 ${Math.round(p.loaded/p.total*100)}%`; },
    (err) => { console.warn('[MK85] GLB failed:', err?.message || err); }
  );

  // Loading complete — procedural reactor is already visible
  setTimeout(() => loadEl.classList.add('hide'), 600);

  // Repulsor Blast
  const blastParts = [];
  const blastGroup = new THREE.Group();
  blastGroup.visible = false;
  scene.add(blastGroup);

  function fireBlast() {
    for (let i = 0; i < 50; i++) {
      const b = new THREE.Mesh(
        new THREE.SphereGeometry(0.015+Math.random()*0.03, 4, 4),
        new THREE.MeshBasicMaterial({
          color: new THREE.Color().setHSL(0.55+Math.random()*0.08, 1, 0.4+Math.random()*0.5),
          transparent: true, opacity: 1, depthWrite: false,
        })
      );
      b.position.set(0, 0, 0.1);
      const ang = Math.random() * Math.PI * 2;
      const spread = 0.2 + Math.random() * 0.5;
      b.userData = {
        vel: new THREE.Vector3(Math.cos(ang)*spread*0.25, Math.sin(ang)*spread*0.25, 0.4+Math.random()*1.0),
        life: 1.0, decay: 0.012+Math.random()*0.035,
      };
      blastGroup.add(b);
      blastParts.push(b);
    }
    blastGroup.visible = true;
    coreLight.intensity = 120;
    centerFlare.material.opacity = 1;
  }

  // Mouse
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('mousemove', e => {
    mouse.tx = (e.clientX / innerWidth) * 2 - 1;
    mouse.ty = -(e.clientY / innerHeight) * 2 + 1;
  });
  window.addEventListener('touchmove', e => {
    mouse.tx = (e.touches[0].clientX / innerWidth) * 2 - 1;
    mouse.ty = -(e.touches[0].clientY / innerHeight) * 2 + 1;
  }, { passive: true });
  window.addEventListener('click', fireBlast);

  // Animation
  const clock = new THREE.Clock();

  function animate(ts) {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    const t = ts * 0.001;

    mouse.x += (mouse.tx - mouse.x) * 0.03;
    mouse.y += (mouse.ty - mouse.y) * 0.03;

    reactor.rotation.y += (mouse.x * 0.25 - reactor.rotation.y) * 0.02;
    reactor.rotation.x += (-mouse.y * 0.18 - reactor.rotation.x) * 0.02;

    // Camera: closer for models, default for reactor
    const camDist = (currentMode === 'reactor') ? 5.5 : 3.2;
    const camBaseY = (currentMode === 'reactor') ? 0.15 : 0.0;
    const targetZ = camDist + mouse.y * 0.6;
    const targetY = camBaseY + mouse.y * 0.2;
    camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.012;
    camera.position.y += (targetY - camera.position.y) * 0.025;
    camera.position.z += (targetZ - camera.position.z) * 0.03;
    camera.lookAt(0, 0, 0);

    const beat = 1 + Math.sin(t*3.2)*0.12 + Math.sin(t*6.8)*0.06 + Math.sin(t*0.9)*0.08;
    coreLight.intensity += (50*beat - coreLight.intensity) * 0.1;
    centerFlare.material.opacity += (0.7 + Math.sin(t*3.2)*0.2 - centerFlare.material.opacity) * 0.1;
    innerTriMat.emissiveIntensity = 3.0 + Math.sin(t*3.2)*1.0 + Math.sin(t*0.9)*0.5;

    coilGroup.rotation.z += dt * 0.12;
    coreGroup.rotation.z += dt * 0.06;
    hudRings.forEach(r => { r.rotation.z += r.userData.speed * dt; });

    const pp = pts.geometry.attributes.position.array;
    for (let i = 0; i < pCount; i++) {
      const pd = pData[i];
      pd.life += pd.ls;
      if (pd.life >= 1) pd.life = 0;
      const r = pd.r + pd.life * 2.0;
      pp[i*3]=Math.cos(pd.a+pd.life*Math.PI*0.5)*Math.sin(pd.phi+pd.life*pd.drift)*r;
      pp[i*3+1]=Math.sin(pd.a+pd.life*Math.PI*0.5)*Math.sin(pd.phi+pd.life*pd.drift)*r;
      pp[i*3+2]=Math.cos(pd.phi+pd.life*pd.drift)*r*0.5+0.1;
    }
    pts.geometry.attributes.position.needsUpdate = true;

    const gpArr = gp.geometry.attributes.position.array;
    for (let i = 0; i < gpCount; i++) {
      const gd = gpData[i];
      gd.a += gd.s * dt;
      gpArr[i*3]=Math.cos(gd.a)*gd.r;
      gpArr[i*3+1]=Math.sin(gd.a)*gd.r;
      gpArr[i*3+2]=gd.zB+Math.sin(t*1.8+gd.a)*0.04;
    }
    gp.geometry.attributes.position.needsUpdate = true;

    for (let i = blastParts.length-1; i >= 0; i--) {
      const bp = blastParts[i];
      bp.userData.life -= bp.userData.decay;
      bp.material.opacity = Math.max(0, bp.userData.life);
      bp.position.add(bp.userData.vel.clone().multiplyScalar(dt*5));
      bp.scale.multiplyScalar(0.984);
      if (bp.userData.life <= 0) {
        blastGroup.remove(bp); bp.geometry.dispose(); bp.material.dispose();
        blastParts.splice(i, 1);
      }
    }
    if (blastParts.length === 0) blastGroup.visible = false;
    if (coreLight.intensity > 80) coreLight.intensity += (50 - coreLight.intensity) * 0.05;

    document.getElementById('power').textContent = (8.0+Math.sin(t*3.2)*0.6+Math.sin(t*0.9)*0.3).toFixed(1)+' GJ/s';
    document.getElementById('temp').textContent = Math.round(3120+Math.sin(t*3.2)*35+Math.sin(t*1.1)*18)+' K';

    // Rotate models if visible
    if (suitGroup.visible && suitGroup.children.length > 0) {
      suitGroup.rotation.y += dt * 0.45;
    }
    if (helmetGroup.visible && helmetGroup.children.length > 0) {
      helmetGroup.rotation.y += dt * 0.55;
    }
    if (glbGroup.visible && glbGroup.children.length > 0) {
      glbGroup.rotation.z += dt * 0.08;
    }

    composer.render();
    if (!animate._firstFrame) {
      animate._firstFrame = true;
      setTimeout(() => loadEl.classList.add('hide'), 600);
    }
  }

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  });
  requestAnimationFrame(animate);

} catch (err) { fail(err.message); }
</script>
</body>
</html>
