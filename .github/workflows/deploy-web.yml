name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Clean & Build web (SPA)
        run: |
          rm -rf dist/web
          npx vite build --config vite.config.web.mts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITESUPABASEURL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITESUPABASEANONKEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITESTRIPEPUBLISHABLEKEY }}
          VITE_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.VITESTRIPEPRICEPROMONTHLY }}
          VITE_STRIPE_PRICE_LIFETIME: ${{ secrets.VITESTRIPEPRICELIFETIME }}
          # VITE_STRIPE_LINK_PRO_MONTHLY and VITE_STRIPE_LINK_LIFETIME are optional (Stripe Payment Links)
      - name: Prepare pages structure
        run: |
          mkdir -p dist/pages/app
          # SPA: move assets to /app/assets/, index.html to /app/
          mv dist/web/assets dist/pages/app/assets/
          mv dist/web/index.html dist/pages/app/index.html
          # Landing page on root
          cp deploy/index.html dist/pages/index.html
          # Privacy / Terms / Download
          cp deploy/privacy.html dist/pages/privacy.html 2>/dev/null || true
          cp deploy/terms.html dist/pages/terms.html 2>/dev/null || true
          cp deploy/download.html dist/pages/download.html 2>/dev/null || true
          # Payment QR images
          cp -r deploy/payment dist/pages/payment/ 2>/dev/null || echo "payment/ not found, skipping"
          # Demo screenshots (for landing page preview)
          mkdir -p dist/pages/demo-screenshots
          cp -r demo-screenshots/*.png demo-screenshots/*.webp dist/pages/demo-screenshots/ 2>/dev/null || echo "demo-screenshots/ not found, skipping"
          # Open Graph share image
          cp deploy/og-image.png dist/pages/og-image.png 2>/dev/null || echo "og-image.png not found, skipping"
          # Favicon (real app icon)
          cp resources/icon.png dist/pages/icon.png 2>/dev/null || echo "icon.png not found, skipping"
          touch dist/pages/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
