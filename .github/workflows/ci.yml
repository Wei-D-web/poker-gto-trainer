name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npx vitest run --config vitest.config.ts
        env:
          VITE_LICENSE_SECRET: ${{ secrets.VITELICENSESECRET }}
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx electron-vite build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --ext .ts,.tsx || true

  package-mac:
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build & Package
        run: npx electron-vite build && npx electron-builder --mac --publish=never
        env:
          # CI 无签名打包：不传 CSC_LINK（空值/残留值会导致 not a file 错误）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: PokerGTO-Trainer-macOS
          path: dist/*.dmg
